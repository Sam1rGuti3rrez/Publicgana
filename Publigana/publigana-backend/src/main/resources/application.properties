# Nombre de la aplicacion
spring.application.name=publigana-backend

# Conexion a PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/publigana
spring.datasource.username=postgres
spring.datasource.password=b97041300306

# Driver
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

logging.level.org.flywaydb=DEBUG

spring.jpa.defer-datasource-initialization=true

# puerto del servidor
server.port=8080

# CORS — orígenes permitidos separados por coma, sin espacios
cors.allowed-origins=http://localhost:5173,https://publigana.vercel.app,https://www.publigana.com

