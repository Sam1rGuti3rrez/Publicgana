# ─────────────────────────────────────────────
# Configuración base — común a todos los perfiles
# ─────────────────────────────────────────────

spring.application.name=publigana-backend


# Perfil activo por defecto (sobreescribir con SPRING_PROFILES_ACTIVE en producción)
spring.profiles.active=developer
# Conexion a PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/publigana}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}


# Driver PostgreSQL — no varía por ambiente
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate


spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false


# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

