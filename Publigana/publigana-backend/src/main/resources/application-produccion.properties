# ─────────────────────────────────────────────
# Perfil: produccion — Render
# Variables de entorno configuradas en el dashboard de Render
# ─────────────────────────────────────────────

# Base de datos — Render PostgreSQL
# Prioriza SPRING_DATASOURCE_* o JDBC_DATABASE_URL si existen;
# de lo contrario construye JDBC URL con variables de host/puerto/bd.
spring.datasource.url=${SPRING_DATASOURCE_URL:${JDBC_DATABASE_URL:jdbc:postgresql://${DB_HOST:${DATABASE_HOST}}:${DB_PORT:${DATABASE_PORT:5432}}/${DB_NAME:${DATABASE_NAME}}}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:${DATABASE_USERNAME:${DATABASE_USER}}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:${DATABASE_PASSWORD}}}

# Sin SQL en logs de producción
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Puerto — Render asigna el puerto via variable PORT; 8080 como fallback
server.port=${PORT:8080}

# CORS — dominios de producción permitidos
cors.allowed-origins=https://publigana.vercel.app,https://www.publigana.com
