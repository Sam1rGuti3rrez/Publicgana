# Test profile for context smoke test.
# Uses in-memory DB so tests don't depend on local PostgreSQL state.
spring.datasource.url=jdbc:h2:mem:publigana_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Keep Flyway active in app/prod; disable only for this smoke test profile.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=none

cors.allowed-origins=http://localhost
